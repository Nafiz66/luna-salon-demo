<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-label="Luna Coiffeur &amp; Beauty Logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dfa6"/>
      <stop offset=".45" stop-color="#d4af5f"/>
      <stop offset="1" stop-color="#a77c2e"/>
    </linearGradient>
    <g id="sc">
      <!-- eine Schere: Spitze bei (0,0), Griffe oben -->
      <path d="M-30 -128 Q-14 -98 0 -72 L13 -4" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
      <path d="M30 -128 Q14 -98 0 -72 L-13 -4" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="-38" cy="-150" rx="17" ry="22" transform="rotate(-18 -38 -150)" fill="none" stroke="url(#g)" stroke-width="8"/>
      <ellipse cx="38" cy="-150" rx="17" ry="22" transform="rotate(18 38 -150)" fill="none" stroke="url(#g)" stroke-width="8"/>
      <circle cx="0" cy="-72" r="4" fill="#0b0b0c"/>
    </g>
  </defs>
  <use href="#sc" transform="translate(200 198) rotate(-46) scale(.82)"/>
  <use href="#sc" transform="translate(200 198) rotate(46) scale(.82)"/>
  <use href="#sc" transform="translate(200 198) scale(.95)"/>
  <path d="M138 222 Q200 200 262 222" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"/>
  <text x="200" y="285" text-anchor="middle" font-family="'Cormorant Garamond','Times New Roman',serif" font-size="64" letter-spacing="6" fill="url(#g)">LUNA</text>
  <text x="200" y="318" text-anchor="middle" font-family="'Cormorant Garamond','Times New Roman',serif" font-size="25" letter-spacing="2.5" fill="url(#g)">COIFFEUR &amp; BEAUTY</text>
</svg>
